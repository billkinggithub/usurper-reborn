<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Usurper Reborn 存档编辑器</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.5 system-ui, "Segoe UI", sans-serif; margin: 0; padding: 16px 20px 48px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .warn { background: #7a2b2b; color: #fff; padding: 8px 12px; border-radius: 6px; margin: 12px 0; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
  select, input, button { font: inherit; padding: 4px 8px; }
  #search { flex: 1 1 220px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid rgba(128,128,128,.25); }
  th { position: sticky; top: 0; background: Canvas; }
  td.key { font-family: ui-monospace, Consolas, monospace; }
  td input { width: 100%; box-sizing: border-box; }
  tr.changed td.key { color: #d97706; font-weight: 600; }
  #out { white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; margin-top: 12px; }
  .ok { color: #15803d; } .bad { color: #b91c1c; }
  button.primary { background: #2563eb; color: #fff; border: 0; border-radius: 6px; font-weight: 600; }
</style>
</head>
<body>
<h1>Usurper Reborn 存档编辑器</h1>
<div class="warn">先<strong>关闭游戏</strong>再保存。游戏运行时会用自动存档覆盖你的修改。</div>

<div class="bar">
  <label>存档 <select id="saves"></select></label>
  <button id="reload">重新读取</button>
  <input id="search" placeholder="搜索字段名，例如 gold / level / hp">
  <button id="save" class="primary">保存修改</button>
</div>

<table>
  <thead><tr><th style="width:34%">字段</th><th style="width:20%">当前值</th><th>新值</th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<div id="out"></div>

<script>
let original = {};      // key -> 原值文本
const rows = document.getElementById('rows');
const out = document.getElementById('out');
const savesSelect = document.getElementById('saves');
const searchBox = document.getElementById('search');

function say(text, cls) {
  out.innerHTML = '';
  const span = document.createElement('span');
  span.className = cls || '';
  span.textContent = text;
  out.appendChild(span);
}

async function loadSaves() {
  const list = await (await fetch('/api/saves')).json();
  savesSelect.innerHTML = '';
  for (const file of list) {
    const option = document.createElement('option');
    option.value = file.name;
    option.textContent = `${file.name}  (${file.modified}, ${(file.size / 1024).toFixed(0)} KB)`;
    savesSelect.appendChild(option);
  }
  if (list.length) await loadPlayer();
}

async function loadPlayer() {
  const file = savesSelect.value;
  if (!file) return;
  say('读取中…');
  const data = await (await fetch('/api/player?file=' + encodeURIComponent(file))).json();
  if (data.error) { say(data.error, 'bad'); return; }

  original = {};
  rows.innerHTML = '';
  for (const field of data.fields) {
    original[field.key] = field.value;

    const tr = document.createElement('tr');
    tr.dataset.key = field.key;

    const keyCell = document.createElement('td');
    keyCell.className = 'key';
    keyCell.textContent = field.key;

    const nowCell = document.createElement('td');
    nowCell.textContent = field.value;

    const editCell = document.createElement('td');
    const input = document.createElement('input');
    input.value = field.value;
    input.dataset.kind = field.kind;
    input.addEventListener('input', () => {
      tr.classList.toggle('changed', input.value !== original[field.key]);
    });
    editCell.appendChild(input);

    tr.append(keyCell, nowCell, editCell);
    rows.appendChild(tr);
  }
  applyFilter();
  say(`${data.file}：${data.name}  Lv.${data.level}，共 ${data.fields.length} 个字段。改完点“保存修改”。`);
}

function applyFilter() {
  const needle = searchBox.value.trim().toLowerCase();
  for (const tr of rows.children) {
    tr.style.display = !needle || tr.dataset.key.toLowerCase().includes(needle) ? '' : 'none';
  }
}

async function saveChanges() {
  const values = {};
  for (const tr of rows.children) {
    const key = tr.dataset.key;
    const input = tr.querySelector('input');
    if (input.value !== original[key]) values[key] = input.value;
  }
  const count = Object.keys(values).length;
  if (!count) { say('没有改动。'); return; }

  say(`保存 ${count} 项…`);
  const response = await fetch('/api/player', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ file: savesSelect.value, values }),
  });
  const result = await response.json();

  if (!result.ok) {
    say('没有保存。\n' + (result.refused || []).join('\n'), 'bad');
    return;
  }
  say('已保存：\n' + result.applied.join('\n')
      + (result.refused && result.refused.length ? '\n\n未保存：\n' + result.refused.join('\n') : '')
      + `\n\n备份：${result.backup}`, 'ok');
  await loadPlayer();
}

savesSelect.addEventListener('change', loadPlayer);
document.getElementById('reload').addEventListener('click', loadPlayer);
document.getElementById('save').addEventListener('click', saveChanges);
searchBox.addEventListener('input', applyFilter);
loadSaves();
</script>
</body>
</html>
